<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Implementación</title>
    <!-- Incluir marked.js para renderizar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2, h3, h4, h5, h6 {
            color: #f0f6fc;
            border-bottom: 1px solid #30363d;
            padding-bottom: 0.3em;
        }
        pre {
            background-color: #161b22;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #30363d;
        }
        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            background-color: rgba(110,118,129,0.4);
            padding: 0.2em 0.4em;
            border-radius: 6px;
            font-size: 85%;
        }
        pre code {
            background-color: transparent;
            padding: 0;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        blockquote {
            border-left: 4px solid #30363d;
            margin: 0;
            padding: 0 1em;
            color: #8b949e;
        }
        ul, ol {
            padding-left: 2em;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }
        table th, table td {
            border: 1px solid #30363d;
            padding: 6px 13px;
        }
        table tr:nth-child(2n) {
            background-color: #161b22;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-refresh {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240,246,252,0.1);
            padding: 5px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-refresh:hover {
            background-color: #2ea043;
        }
        .loading {
            text-align: center;
            color: #8b949e;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="border:none; margin:0; padding:0;">Plan de Implementación / Respuesta</h1>
            <button class="btn-refresh" onclick="cargarPlan()">Actualizar</button>
        </div>
        <div id="content" class="markdown-body">
            <div class="loading">Cargando último plan del Agente...</div>
        </div>
    </div>

    <script>
        async function cargarPlan() {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '<div class="loading">Cargando...</div>';
            
            try {
                // Fetch de la respuesta del agente (se guarda en estado.json -> respuesta.txt)
                const backend = localStorage.getItem('tfte_gemini_backend') || 'gemini';
                const response = await fetch('/api/agente/plan');
                const data = await response.json();
                
                if (data.plan) {
                    contentDiv.innerHTML = marked.parse(data.plan);
                } else {
                    contentDiv.innerHTML = '<div class="loading">Aún no hay ningún plan o respuesta registrada. Pídele al Agente que genere un plan.</div>';
                }
            } catch (error) {
                console.error("Error cargando el plan:", error);
                contentDiv.innerHTML = '<div class="loading" style="color: #ff7b72;">Error al cargar el plan de implementación. Verifica la conexión con el servidor local.</div>';
            }
        }

        // Cargar al inicio
        cargarPlan();
    </script>
</body>
</html>
