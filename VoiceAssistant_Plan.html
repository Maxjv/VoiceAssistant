<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant — Next Steps</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --header-bg: #1e293b;
      --header-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --card-bg: #131a2a;
      --terminado-bg: #10b981;
      --terminado-border: #059669;
      --enproceso-bg: #854d0e;
      --enproceso-border: #713f12;
      --pendiente-bg: #c2410c;
      --pendiente-border: #9a3412;
      --proximos-bg: #b91c1c;
      --proximos-border: #991b1b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .global-filters {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--header-border);
    }

    .filter-cb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }

    .filter-cb:hover {
      opacity: 0.8;
    }

    .filter-cb input {
      accent-color: var(--accent-color);
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
    }

    #saveStatus {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #saveStatus .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    #saveStatus.ok .dot {
      background: var(--terminado-border);
      box-shadow: 0 0 6px var(--terminado-border);
    }

    #saveStatus.saving .dot {
      background: var(--accent-color);
      box-shadow: 0 0 6px var(--accent-color);
      animation: pulse 1s infinite;
    }

    #saveStatus.error .dot {
      background: var(--proximos-border);
      box-shadow: 0 0 6px var(--proximos-border);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .subapp-card {
      background: var(--header-bg);
      border: 1px solid var(--header-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .subapp-header {
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--accent-color);
      border-bottom: 1px solid var(--header-border);
      background: rgba(59, 130, 246, 0.06);
    }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      padding: 14px;
    }

    .field-block {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--header-border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label .add-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
    }

    .field-label .add-item-btn:hover {
      color: var(--accent-color);
      background: rgba(255, 255, 255, 0.06);
    }

    .field-label .add-item-btn .material-icons-round {
      font-size: 1rem;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--header-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, background 0.2s;
    }

    .item-card.terminado {
      background: var(--terminado-bg);
      border-color: var(--terminado-border);
    }

    .item-card.en-proceso-haciendo {
      background: var(--enproceso-bg);
      border-color: var(--enproceso-border);
    }

    .item-card.pendiente {
      background: var(--pendiente-bg);
      border-color: var(--pendiente-border);
    }

    .item-card.proximos {
      background: var(--proximos-bg);
      border-color: var(--proximos-border);
    }

    .item-card.terminado .status-select {
      background: var(--terminado-border);
      border-color: var(--terminado-border);
    }

    .item-card.en-proceso-haciendo .status-select {
      background: var(--enproceso-border);
      border-color: var(--enproceso-border);
    }

    .item-card.pendiente .status-select {
      background: var(--pendiente-border);
      border-color: var(--pendiente-border);
    }

    .item-card.proximos .status-select {
      background: var(--proximos-border);
      border-color: var(--proximos-border);
    }

    .item-text {
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--text-primary);
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 20px;
      border-radius: 5px;
      padding: 2px 4px;
    }

    .item-text:focus {
      background: rgba(255, 255, 255, 0.06);
    }

    .item-text:empty::before {
      content: attr(data-placeholder);
      color: var(--text-secondary);
    }

    .item-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-select {
      flex: 1;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text-primary);
      border: 1px solid var(--header-border);
      border-radius: 6px;
      padding: 4px 6px;
      outline: none;
    }

    .remove-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .remove-item-btn:hover {
      color: var(--proximos-border);
      background: rgba(255, 255, 255, 0.06);
    }

    .remove-item-btn .material-icons-round {
      font-size: 1rem;
    }

    .toggle-done-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .toggle-done-btn:hover {
      color: var(--terminado-bg);
      background: rgba(255, 255, 255, 0.06);
    }

    .toggle-done-btn.done {
      color: var(--terminado-bg);
    }

    .toggle-done-btn .material-icons-round {
      font-size: 1rem;
    }

    .send-task-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .send-task-btn:hover {
      background: rgba(59, 130, 246, 0.15);
    }

    .send-task-btn .material-icons-round {
      font-size: 1rem;
    }


    .empty-msg {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <h1>Voice Assistant — Next Steps</h1>
      <div class="global-filters" id="globalFilters">
        <label class="filter-cb"><input type="checkbox" value="terminado" checked> Terminado</label>
        <label class="filter-cb"><input type="checkbox" value="pendiente" checked> Pendiente</label>
        <label class="filter-cb"><input type="checkbox" value="en-proceso-haciendo" checked> En proceso</label>
        <label class="filter-cb"><input type="checkbox" value="proximos" checked> Próximos</label>
      </div>
    </div>
    <div id="saveStatus" class="ok"><span class="dot"></span><span class="txt">Local (offline)</span></div>
  </header>
  <main id="mainContainer">
    <p class="empty-msg">Cargando...</p>
  </main>

  <script>
    const STATUS_OPTIONS = ["Pendiente", "En proceso/haciendo", "Terminado", "Proximos"];
    const FIELD_LABELS = {
      objetivo: "Objetivo", prompt: "Prompt para IDE", detalles: "Detalles Extras"
    };
    const FIELD_ORDER = ['objetivo', 'prompt', 'detalles'];
    const statusClass = s => (s || 'Pendiente').toLowerCase().replace(/[\s/]+/g, '-').replace(/[^a-z\-]/g, '');

    let data = [
      {
        "id": "fase_1_1",
        "subApp": "1.1. Eliminar la Fuga de Tokens (Exit code 1)",
        "fields": {
          "objetivo": { "items": [{ "text": "Evitar que el sistema haga 'pings' automáticos consultando saldo y agote la cuota de la API en segundo plano.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Analiza exhaustivamente app.js y server.js. Existe un temporizador, bucle de sondeo (polling) o 'keep-alive' que se está disparando automáticamente en segundo plano hacia /api/chat o /api/agente, provocando que Groq o el CLI devuelvan continuamente 'Exit code 1 - Individual quota reached'. Ubica este bloque de código y modifícalo para que las peticiones a la IA solo se disparen tras una acción explícita del usuario (clic o envío de voz). No rompas el pollAgente que escucha la respuesta de una tarea que sí está en ejecución.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_1_2",
        "subApp": "1.2. Perfección del Live Reload",
        "fields": {
          "objetivo": { "items": [{ "text": "Lograr recargas del puerto 3000 transparentes y fluidas.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "En server.js y app.html, revisa el sistema actual de Live Reload del iframeReact que apunta al puerto 3000. Actualmente, usar location.reload() o about:blank genera un pantallazo blanco de medio segundo. Refactoriza este mecanismo implementando una técnica de 'Double Buffering' en el DOM: crea un iframe invisible paralelo, recárgalo allí, y cuando detectes el evento onload, haz un intercambio de opacidad (swap) con el iframe principal. El objetivo es que la recarga de código sea 100% invisible para el ojo.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_1_3",
        "subApp": "1.3. Persistencia de Estado de la Vista",
        "fields": {
          "objetivo": { "items": [{ "text": "Tras compilar, volver exactamente al sub-menú, modal o filtro modificado, sin hardcodear el componente.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Necesito implementar persistencia de estado post-recarga en mi frontend (puerto 3000) de manera genérica. Diseña un wrapper en React (ej. un Custom Hook o un Contexto global) que intercepte y guarde el estado de navegación activo (rutas internas, modales abiertos, pestañas activas como 'Roles') en el sessionStorage o en la URL del iframe. Al detonarse el Live Reload, el componente raíz debe leer este estado y forzar el renderizado de la sub-vista exacta donde el usuario hizo el último cambio, sin hardcodear nombres de componentes.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_2_1",
        "subApp": "2.1. Clonación de Entorno a Producción",
        "fields": {
          "objetivo": { "items": [{ "text": "Aislar los archivos del Asistente del entorno de desarrollo. a) (El desarrollo que muestra el puerto:3000-'src/interface') b) El archivo de el boton Control y la ruta de las IMG's", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Escribe un script en Node.js llamado build_production.js. Este script actuará como el empaquetador oficial para generar la versión final distribuible del Asistente de Voz para los clientes finales. ES VITAL QUE SEA 100% GENÉRICO Y AGNÓSTICO: está estrictamente prohibido usar rutas absolutas hardcodeadas (nada de C:\\...) o hacer referencias a proyectos de terceros...\nUtiliza rutas dinámicas relativas...\nCopia únicamente los elementos estrictamente necesarios...\nLee el archivo .env actual, pero purga/limpia el valor de todas las variables sensibles...\nAsegúrate de excluir node_modules...\nAñade logs de consola coloridos...", "status": "Terminado" }] },
          "detalles": { "items": [{ "text": "Con este prompt, el agente te va a crear un script que, al ejecutarlo, generará una carpetita hermosa y limpia llamada dist_production. Esa carpeta será tu 'caja mágica': lista para ser comprimida en un instalador.", "status": "Terminado" }] }
        }
      },
      {
        "id": "fase_2_2",
        "subApp": "2.2. Botón 'Control' Dinámico (Creador de Templates)",
        "fields": {
          "objetivo": { "items": [{ "text": "Permitir al usuario final crear y controlar sus propias listas de tareas y tarjetas sin depender de tu archivo 'TFTE Next Steps'.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "En app.js y server.js, el botón de 'Control' actualmente está hardcodeado a mi archivo personal. Rediseña esta arquitectura: crea un endpoint que genere un archivo JSON/HTML de 'Template de Tareas' vacío en el CONTEXT_PATH del cliente. Implementa una vista en el frontend que, al detectar que el archivo no existe, le pregunte al usuario: '¿Crear entorno de control para este proyecto?'. Si acepta, genera el archivo dinámicamente y vincula el iframe de Control a este nuevo archivo.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_2_3",
        "subApp": "2.3. Ruta Inteligente del Plan de Implementación ('Brain')",
        "fields": {
          "objetivo": { "items": [{ "text": "Que el asistente busque el plan estratégico donde corresponde, no en tu carpeta de Windows.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "En server.js, localiza el endpoint /api/agente/plan que busca el directorio 'brain' en os.homedir(). Modifica esta función para que sea inteligente: primero debe buscar una carpeta .brain u ocultos de planes dentro del ROOT_DIR (el proyecto del cliente). Si no la encuentra, debe retroceder a buscar la ruta por defecto del IDE. Devuelve un estado 404 claro si no hay planes, para que el frontend muestre un mensaje UX amigable en vez de fallar.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_2_4",
        "subApp": "2.4. Visor Multimedia Dinámico (Imgs)",
        "fields": {
          "objetivo": { "items": [{ "text": "Levantar las imágenes del proyecto activo del usuario.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Modifica el endpoint /api/browse en server.js y la pestaña de imágenes. Actualmente apunta a una carpeta hardcodeada FrontImgs. Reescribe la lógica para que escanee recursivamente el CONTEXT_PATH del usuario buscando carpetas típicas de assets (ej. /public/images, /src/assets). Si encuentra imágenes, debe servirlas dinámicamente en el iframe de la Galería.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_3_1",
        "subApp": "3.1. Auto-Reconexión del Túnel (Resiliencia)",
        "fields": {
          "objetivo": { "items": [{ "text": "Que el software reinicie Cloudflare solo si se corta por inactividad.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Crea un script secundario tunnel_monitor.ps1. Su función será ejecutarse en segundo plano (bucle while($true)) y comprobar cada 30 segundos si el proceso cloudflared.exe sigue activo y respondiendo. Si detecta que el túnel se cayó, debe matar el proceso huérfano, lanzar uno nuevo, esperar a que genere el log, extraer la nueva URL y sobreescribir current-url.txt silenciosamente.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_3_2",
        "subApp": "3.2. Notificación por Correo de Nueva URL",
        "fields": {
          "objetivo": { "items": [{ "text": "Mandarte la nueva URL por mail cuando Cloudflare la cambie.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Modifica server.js para integrar un sistema de notificaciones automáticas por correo electrónico utilizando nodemailer. Contexto del producto: El instalador del software le pedirá al cliente final su correo electrónico y lo escribirá dinámicamente en el archivo .env bajo la variable USER_EMAIL...\nConfigura el transporte (Transport) de Nodemailer preparándolo para leer credenciales corporativas desde el .env...\nImplementa un fs.watch o fs.watchFile apuntando al archivo current-url.txt...", "status": "Terminado" }] },

        }
      },
      {
        "id": "fase_3_3",
        "subApp": "3.3. Licencia Vinculada a Hardware",
        "fields": {
          "objetivo": { "items": [{ "text": "Evitar que renueven el trial borrando un .json.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Modifica la función getLicenseStatus en server.js. En lugar de basarse en un archivo JSON fácilmente borrable, utiliza el módulo nativo os.networkInterfaces() para extraer la dirección MAC principal de la máquina. Genera un Hash SHA-256 usando esta MAC y guarda la fecha de inicio del Trial de 7 días usando este Hash. Esto hará el bloqueo de trial mucho más robusto contra manipulaciones básicas.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_3_4",
        "subApp": "3.4. Base de Datos Central (Licencias)",
        "fields": {
          "objetivo": { "items": [{ "text": "Almacenar y validar remotamente los HWID (MAC Addresses) de los clientes.", "status": "Pendiente" }] },
          "prompt": { "items": [{ "text": "Desarrolla el script backend para el 'Servidor Madre' (ej. en Vercel, Firebase o Supabase) que recibirá el POST desde el server.js del cliente con su HWID generado en tiempo de ejecución. El servidor madre guardará el HWID en una base de datos junto con la fecha de expiración, y devolverá true/false según si la licencia sigue activa.", "status": "Pendiente" }] },
          "detalles": { "items": [{ "text": "Este proceso ocurre en el servidor Node.js del cliente (server.js) EN TIEMPO DE EJECUCIÓN (cuando arranca el Asistente), NO durante la instalación (Inno Setup). Así evitamos fraudes por clonación de discos.", "status": "Pendiente" }] }
        }
      },
      {
        "id": "fase_4_1",
        "subApp": "4.1. Mini App Desktop de Rescate",
        "fields": {
          "objetivo": { "items": [{ "text": "Un ejecutable local en caso de que la red externa falle totalmente.", "status": "Terminado" }] },
          "prompt": { "items": [{ "text": "Desarrolla una pequeña interfaz gráfica de escritorio en Python usando tkinter. El archivo se llamará Tfte_Rescue_Panel.pyw. Debe tener una ventana minimalista oscura con dos botones grandes: 'Forzar Reinicio del Túnel' y 'Reiniciar Asistente Local'. Estos botones ejecutarán subprocesos del sistema para matar node.exe y cloudflared.exe e invocar el script de arranque nuevamente. Es un panel de control a prueba de fallos.", "status": "Terminado" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_4_2",
        "subApp": "4.2. Go-to-Market y Distribución",
        "fields": {
          "objetivo": { "items": [{ "text": "Cómo llegar a tu SOM inicial (50.000 a 200.000 usuarios).", "status": "Pendiente" }] },
          "prompt": { "items": [{ "text": "Creación de Aplicación Android", "status": "Pendiente" }] },
          "detalles": { "items": [{ "text": "Escaparate Digital: Crear una Landing Page gratuita y sencilla que explique la propuesta de valor y contenga el link de descarga. Canales de Tracción: Publicar el asistente en GitHub y posicionarlo en los marketplaces de los IDEs. Mensaje de Venta: Enfocarse en la bajísima latencia y ejecución local.", "status": "Pendiente" }] }
        }
      },
      {
        "id": "fase_5_1",
        "subApp": "5.1. Detección de Archivo Activo (Frontend)",
        "fields": {
          "objetivo": { "items": [{ "text": "Conocer en qué archivo React está trabajando el usuario en tiempo real.", "status": "Proximos" }] },
          "prompt": { "items": [{ "text": "Configura un window.addEventListener('message', ...) en app.js para escuchar eventos provenientes del iframeReact. La app de React enviará mensajes con su ruta actual (ej. { type: 'ACTIVE_FILE', file: 'ComparePlayersBI.js' }). Guarda este archivo en una variable global para usarlo como contexto en las siguientes peticiones de voz.", "status": "Proximos" }] },
          "detalles": { "items": [] }
        }
      },
      {
        "id": "fase_5_2",
        "subApp": "5.2. Smart @-Mentions",
        "fields": {
          "objetivo": { "items": [{ "text": "Interactuar de forma eficiente usando @-mentions basadas en el archivo activo.", "status": "Proximos" }] },
          "prompt": { "items": [{ "text": "Implementa la funcionalidad 'Smart @-Mentions' en el frontend y backend. Inyección Visual: Al hacer clic en keyboardBtn inyecta '@NombreDelArchivo.js '. Optimización del Prompt: En /api/agente, si el mensaje comienza con @, extrae el archivo y concatena una instrucción oculta limitando el contexto estrictamente a ese archivo.", "status": "Proximos" }] },
          "detalles": { "items": [{ "text": "Asegúrate de que la lógica sea robusta y no rompa la ejecución si el usuario decide borrar el arroba manualmente.", "status": "Proximos" }] }
        }
      },
      {
        "id": "fase_5_3",
        "subApp": "5.3. Toggle de Funciones B2B (Separación Free/Premium)",
        "fields": {
          "objetivo": { "items": [{ "text": "Downgradear features del plan Free tras los 7 días de prueba completa, y añadir features exclusivos al Premium.", "status": "Proximos" }] },
          "prompt": { "items": [{ "text": "En server.js, expande el licenseMiddleware. Inyecta un objeto 'features' en la API. Si isPro es false (y expiró el trial), deshabilita historial, temas, y Smart @-Mentions. En app.js, lee este objeto y oculta o desactiva visualmente estos paneles.", "status": "Proximos" }] },
          "detalles": { "items": [{ "text": "Estrategia de Ventas: Darle 7 días de acceso TOTAL a la herramienta para que se enganchen. Una vez venza, capar funcionalidades Premium y dejar lo básico. Guardar 1 o 2 features extra para futuras actualizaciones de retención.", "status": "Proximos" }] }
        }
      },
      {
        "id": "fase_6_1",
        "subApp": "6.1. Refactorización (Proyecto Cliente: TFTE)",
        "fields": {
          "objetivo": { "items": [{ "text": "Refactorizar la aplicación de fútbol (TFTE) de 'useState' a URLs reales (react-router-dom) para habilitar Deep Linking y Live Reload 100% nativo.", "status": "Proximos" }] },
          "prompt": { "items": [{ "text": "Instala react-router-dom en el proyecto TFTE. En App.js, reemplaza el estado 'screen' por un <BrowserRouter> y <Routes>. En AppRoutes.js, exporta las rutas estáticas. En los Index.js de cada módulo (ej. 2mog), reemplaza el estado 'currentView' por rutas anidadas. Reemplaza todos los botones de 'onBack' y handlers por el hook useNavigate() o <Link>.", "status": "Proximos" }] },
          "detalles": { "items": [{ "text": "Esta tarea pertenece al proyecto de fútbol (C:\\TFTE), NO al producto comercial Voice Assistant. Se hará en el futuro para modernizar la arquitectura del cliente.", "status": "Proximos" }] }
        }
      }
    ];

    const mainContainer = document.getElementById('mainContainer');
    const saveStatusEl = document.getElementById('saveStatus');

    function setSaveStatus(state, text) {
      saveStatusEl.className = state;
      saveStatusEl.querySelector('.txt').textContent = text;
    }

    function applyGlobalFilter() {
      const checkedValues = Array.from(document.querySelectorAll('#globalFilters input[type="checkbox"]:checked')).map(cb => cb.value);

      const allItemCards = document.querySelectorAll('.item-card');
      allItemCards.forEach(card => {
        const isMatch = checkedValues.some(val => card.classList.contains(val));
        card.style.display = isMatch ? 'flex' : 'none';
      });

      const allFieldBlocks = document.querySelectorAll('.field-block');
      allFieldBlocks.forEach(block => {
        const visibleCards = Array.from(block.querySelectorAll('.item-card')).filter(card => card.style.display !== 'none');
        if (visibleCards.length > 0) {
          block.style.display = 'flex';
        } else {
          block.style.display = 'none';
        }
      });

      const allSubApps = document.querySelectorAll('.subapp-card');
      allSubApps.forEach(subApp => {
        const visibleBlocks = Array.from(subApp.querySelectorAll('.field-block')).filter(block => block.style.display !== 'none');
        if (visibleBlocks.length > 0) {
          subApp.style.display = 'block';
        } else {
          subApp.style.display = 'none';
        }
      });
    }

    document.querySelectorAll('#globalFilters input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', applyGlobalFilter);
    });

    function render() {
      mainContainer.innerHTML = '';
      data.forEach((row, rowIdx) => {
        const card = document.createElement('div');
        card.className = 'subapp-card';

        const header = document.createElement('div');
        header.className = 'subapp-header';
        header.textContent = row.subApp;
        card.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'fields-grid';

        FIELD_ORDER.forEach(field => {
          const block = document.createElement('div');
          block.className = 'field-block';

          const label = document.createElement('div');
          label.className = 'field-label';
          const labelText = document.createElement('span');
          labelText.textContent = FIELD_LABELS[field];
          const addBtn = document.createElement('button');
          addBtn.className = 'add-item-btn';
          addBtn.title = 'Agregar sub-card';
          addBtn.innerHTML = '<span class="material-icons-round">add</span>';
          addBtn.onclick = () => {
            row.fields[field].items.push({ text: '', status: 'Pendiente' });
            render();
          };
          label.appendChild(labelText);
          label.appendChild(addBtn);
          block.appendChild(label);

          row.fields[field].items.forEach((item, itemIdx) => {
            const itemCard = document.createElement('div');
            itemCard.className = 'item-card ' + statusClass(item.status);

            const text = document.createElement('div');
            text.className = 'item-text';
            text.contentEditable = 'true';
            text.setAttribute('data-placeholder', 'Escribí acá...');
            text.textContent = item.text;
            text.addEventListener('blur', () => {
              if (item.text !== text.textContent) {
                item.text = text.textContent;
              }
            });
            itemCard.appendChild(text);

            const footer = document.createElement('div');
            footer.className = 'item-footer';

            const select = document.createElement('select');
            select.className = 'status-select';
            STATUS_OPTIONS.forEach(opt => {
              const o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              if (item.status === opt) o.selected = true;
              select.appendChild(o);
            });
            select.addEventListener('change', () => {
              item.status = select.value;
              itemCard.className = 'item-card ' + statusClass(item.status);
              if (toggleBtn) toggleBtn.className = 'toggle-done-btn' + (item.status === 'Terminado' ? ' done' : '');
              applyGlobalFilter();
              autoSave();
            });
            footer.appendChild(select);

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'toggle-done-btn' + (item.status === 'Terminado' ? ' done' : '');
            toggleBtn.title = 'Marcar como Terminado / Pendiente';
            toggleBtn.innerHTML = '<span class="material-icons-round">check_circle</span>';
            toggleBtn.onclick = () => {
              item.status = item.status === 'Terminado' ? 'Pendiente' : 'Terminado';
              select.value = item.status;
              itemCard.className = 'item-card ' + statusClass(item.status);
              toggleBtn.className = 'toggle-done-btn' + (item.status === 'Terminado' ? ' done' : '');
              applyGlobalFilter();
              autoSave();
            };
            footer.appendChild(toggleBtn);

            const sendBtn = document.createElement('button');
            sendBtn.className = 'send-task-btn';
            sendBtn.title = 'Enviar tarea al Agente';
            sendBtn.innerHTML = '<span class="material-icons-round">send</span>';
            sendBtn.onclick = () => {
              const originalIcon = sendBtn.innerHTML;
              sendBtn.innerHTML = '<span class="material-icons-round" style="animation: pulse 1s infinite;">hourglass_empty</span>';

              fetch('/api/agente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: item.text, backend: 'gemini' })
              }).then(r => r.json()).then(res => {
                if (res.ok) {
                  item.status = 'En proceso/haciendo';
                  select.value = item.status;
                  itemCard.className = 'item-card ' + statusClass(item.status);
                  toggleBtn.className = 'toggle-done-btn';
                  applyGlobalFilter();
                  autoSave();
                }
              }).catch(console.error).finally(() => {
                sendBtn.innerHTML = originalIcon;
              });
            };
            footer.appendChild(sendBtn);


            if (row.fields[field].items.length > 1) {
              const removeBtn = document.createElement('button');
              removeBtn.className = 'remove-item-btn';
              removeBtn.title = 'Quitar sub-card';
              removeBtn.innerHTML = '<span class="material-icons-round">close</span>';
              removeBtn.onclick = () => {
                row.fields[field].items.splice(itemIdx, 1);
                render();
              };
              footer.appendChild(removeBtn);
            }


            itemCard.appendChild(footer);
            block.appendChild(itemCard);
          });

          grid.appendChild(block);
        });

        card.appendChild(grid);
        mainContainer.appendChild(card);
      });

      applyGlobalFilter();
    }

    render();
    setSaveStatus('ok', 'Cargado (offline)');

    // ─── AUTO-SAVE ──────────────────────────────────────────────────────────
    let saveTimeout;
    function autoSave() {
      clearTimeout(saveTimeout);
      setSaveStatus('saving', 'Guardando...');

      saveTimeout = setTimeout(() => {
        fetch('/api/save-next-steps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(data)
        })
          .then(res => res.json())
          .then(() => setSaveStatus('ok', 'Guardado ✓'))
          .catch(err => {
            console.error('Error guardando:', err);
            setSaveStatus('error', 'Error al guardar');
          });
      }, 800); // Espera 800ms después del último cambio
    }

    // Listener para cambios en el modelo
    const originalSetRender = window.render;
    document.addEventListener('blur', (e) => {
      if (e.target.classList?.contains('item-text') || e.target.classList?.contains('status-select')) {
        autoSave();
      }
    }, true);
  </script>
</body>

</html>
