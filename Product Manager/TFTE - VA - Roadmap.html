<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFTE Voice Assistant — Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --header-bg: #1e293b;
      --header-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --card-bg: #131a2a;
      --terminado-bg: #10b981;
      --terminado-border: #059669;
      --enproceso-bg: #854d0e;
      --enproceso-border: #713f12;
      --pendiente-bg: #c2410c;
      --pendiente-border: #9a3412;
      --proximos-bg: #b91c1c;
      --proximos-border: #991b1b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .global-filters {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--header-border);
    }

    .filter-cb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }

    .filter-cb:hover {
      opacity: 0.8;
    }

    .filter-cb input {
      accent-color: var(--accent-color);
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
    }

    #saveStatus {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #saveStatus .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    #saveStatus.ok .dot {
      background: var(--terminado-border);
      box-shadow: 0 0 6px var(--terminado-border);
    }

    #saveStatus.saving .dot {
      background: var(--accent-color);
      box-shadow: 0 0 6px var(--accent-color);
      animation: pulse 1s infinite;
    }

    #saveStatus.error .dot {
      background: var(--proximos-border);
      box-shadow: 0 0 6px var(--proximos-border);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .subapp-card {
      background: var(--header-bg);
      border: 1px solid var(--header-border);
      border-radius: 14px;
      overflow: hidden;
    }

    .subapp-header {
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--accent-color);
      border-bottom: 1px solid var(--header-border);
      background: rgba(59, 130, 246, 0.06);
    }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      padding: 14px;
    }

    .field-block {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--header-border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-label .add-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
    }

    .field-label .add-item-btn:hover {
      color: var(--accent-color);
      background: rgba(255, 255, 255, 0.06);
    }

    .field-label .add-item-btn .material-icons-round {
      font-size: 1rem;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--header-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s, background 0.2s;
    }

    .item-card.terminado {
      background: var(--terminado-bg);
      border-color: var(--terminado-border);
    }

    .item-card.en-proceso-haciendo {
      background: var(--enproceso-bg);
      border-color: var(--enproceso-border);
    }

    .item-card.pendiente {
      background: var(--pendiente-bg);
      border-color: var(--pendiente-border);
    }

    .item-card.proximos {
      background: var(--proximos-bg);
      border-color: var(--proximos-border);
    }

    .item-card.terminado .status-select {
      background: var(--terminado-border);
      border-color: var(--terminado-border);
    }

    .item-card.en-proceso-haciendo .status-select {
      background: var(--enproceso-border);
      border-color: var(--enproceso-border);
    }

    .item-card.pendiente .status-select {
      background: var(--pendiente-border);
      border-color: var(--pendiente-border);
    }

    .item-card.proximos .status-select {
      background: var(--proximos-border);
      border-color: var(--proximos-border);
    }

    .item-text {
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--text-primary);
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 20px;
      border-radius: 5px;
      padding: 2px 4px;
    }

    .item-text:focus {
      background: rgba(255, 255, 255, 0.06);
    }

    .item-text:empty::before {
      content: attr(data-placeholder);
      color: var(--text-secondary);
    }

    .item-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-select {
      flex: 1;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text-primary);
      border: 1px solid var(--header-border);
      border-radius: 6px;
      padding: 4px 6px;
      outline: none;
    }

    .remove-item-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .remove-item-btn:hover {
      color: var(--proximos-border);
      background: rgba(255, 255, 255, 0.06);
    }

    .remove-item-btn .material-icons-round {
      font-size: 1rem;
    }

    .empty-msg {
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-left">
      <h1>TFTE Voice Assistant — Roadmap</h1>
      <div class="global-filters" id="globalFilters">
        <label class="filter-cb"><input type="checkbox" value="terminado" checked> Terminado</label>
        <label class="filter-cb"><input type="checkbox" value="pendiente" checked> Pendiente</label>
        <label class="filter-cb"><input type="checkbox" value="en-proceso-haciendo" checked> En proceso</label>
        <label class="filter-cb"><input type="checkbox" value="proximos" checked> Próximos</label>
      </div>
    </div>
    <div id="saveStatus" class="ok"><span class="dot"></span><span class="txt">Local (offline)</span></div>
  </header>
  <main id="mainContainer">
    <p class="empty-msg">Cargando...</p>
  </main>

  <script>
    const STATUS_OPTIONS = ["Pendiente", "En proceso/haciendo", "Terminado", "Proximos"];
    const FIELD_LABELS = {
      preparacion: "Preparación & Setup",
      marketing: "Marketing & Web",
      licencia: "Sistema de Licencias",
      lanzamiento: "Lanzamiento & GTM"
    };
    const FIELD_ORDER = ['preparacion', 'licencia', 'marketing', 'lanzamiento'];
    const statusClass = s => (s || 'Pendiente').toLowerCase().replace(/[\s/]+/g, '-').replace(/[^a-z\-]/g, '');

    let data = [
      {
        "id": "va_roadmap",
        "subApp": "Voice Assistant Go-to-Market",
        "fields": {
          "preparacion": {
            "items": [
              { "text": "Crear licencia.txt e integrarlo en el instalador .iss", "status": "Terminado" },
              { "text": "Crear README.md público detallando qué es y uso de la clave BYOK", "status": "Terminado" },
              { "text": "Iteración de Compilador: Volver a compilar el instalador .exe con Inno Setup una vez verificadas las licencias", "status": "Pendiente" }
            ]
          },
          "licencia": {
            "items": [
              { "text": "Investigar e implementar verificación de licencia por Machine ID usando Lemon Squeezy o Keygen.sh", "status": "Terminado" },
              { "text": "Implementar lógica en server.js para limitar uso tras 14 días", "status": "Terminado" },
              { "text": "Actualizar app.html/app.js para mostrar campo de 'Ingresar Clave de Licencia' o aviso de Trial caducado", "status": "Terminado" }
            ]
          },
          "marketing": {
            "items": [
              { "text": "Crear una web minimalista con titular, video y botón de descarga", "status": "Pendiente" },
              { "text": "Grabar la pantalla (60-90s) del Aha! Moment controlando el código local", "status": "Pendiente" },
              { "text": "Configurar archivo .exe en Lemon Squeezy/Gumroad a $0 para captar emails", "status": "Pendiente" }
            ]
          },
          "lanzamiento": {
            "items": [
              { "text": "Publicar repositorio público en GitHub (README + Releases)", "status": "Pendiente" },
              { "text": "Lanzamiento Soft: Compartir en subreddits de nicho (r/LocalLLaMA) pidiendo feedback", "status": "Pendiente" },
              { "text": "Lanzamiento Hard: Preparar post para Hacker News ('Show HN') y lanzar en Product Hunt", "status": "Pendiente" }
            ]
          }
        }
      }
    ];

    const mainContainer = document.getElementById('mainContainer');
    const saveStatusEl = document.getElementById('saveStatus');

    function setSaveStatus(state, text) {
      saveStatusEl.className = state;
      saveStatusEl.querySelector('.txt').textContent = text;
    }

    function applyGlobalFilter() {
      const checkedValues = Array.from(document.querySelectorAll('#globalFilters input[type="checkbox"]:checked')).map(cb => cb.value);

      const allItemCards = document.querySelectorAll('.item-card');
      allItemCards.forEach(card => {
        const isMatch = checkedValues.some(val => card.classList.contains(val));
        card.style.display = isMatch ? 'flex' : 'none';
      });

      const allFieldBlocks = document.querySelectorAll('.field-block');
      allFieldBlocks.forEach(block => {
        const visibleCards = Array.from(block.querySelectorAll('.item-card')).filter(card => card.style.display !== 'none');
        if (visibleCards.length > 0) {
          block.style.display = 'flex';
        } else {
          block.style.display = 'none';
        }
      });

      const allSubApps = document.querySelectorAll('.subapp-card');
      allSubApps.forEach(subApp => {
        const visibleBlocks = Array.from(subApp.querySelectorAll('.field-block')).filter(block => block.style.display !== 'none');
        if (visibleBlocks.length > 0) {
          subApp.style.display = 'block';
        } else {
          subApp.style.display = 'none';
        }
      });
    }

    document.querySelectorAll('#globalFilters input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', applyGlobalFilter);
    });

    function render() {
      mainContainer.innerHTML = '';
      data.forEach((row, rowIdx) => {
        const card = document.createElement('div');
        card.className = 'subapp-card';

        const header = document.createElement('div');
        header.className = 'subapp-header';
        header.textContent = row.subApp;
        card.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'fields-grid';

        FIELD_ORDER.forEach(field => {
          const block = document.createElement('div');
          block.className = 'field-block';

          const label = document.createElement('div');
          label.className = 'field-label';
          const labelText = document.createElement('span');
          labelText.textContent = FIELD_LABELS[field];
          const addBtn = document.createElement('button');
          addBtn.className = 'add-item-btn';
          addBtn.title = 'Agregar sub-card';
          addBtn.innerHTML = '<span class="material-icons-round">add</span>';
          addBtn.onclick = () => {
            row.fields[field].items.push({ text: '', status: 'Pendiente' });
            render();
          };
          label.appendChild(labelText);
          label.appendChild(addBtn);
          block.appendChild(label);

          row.fields[field].items.forEach((item, itemIdx) => {
            const itemCard = document.createElement('div');
            itemCard.className = 'item-card ' + statusClass(item.status);

            const text = document.createElement('div');
            text.className = 'item-text';
            text.contentEditable = 'true';
            text.setAttribute('data-placeholder', 'Escribí acá...');
            text.textContent = item.text;
            text.addEventListener('blur', () => {
              if (item.text !== text.textContent) {
                item.text = text.textContent;
                // autoSave() omitted for local usage
              }
            });
            itemCard.appendChild(text);

            const footer = document.createElement('div');
            footer.className = 'item-footer';

            const select = document.createElement('select');
            select.className = 'status-select';
            STATUS_OPTIONS.forEach(opt => {
              const o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              if (item.status === opt) o.selected = true;
              select.appendChild(o);
            });
            select.addEventListener('change', () => {
              item.status = select.value;
              itemCard.className = 'item-card ' + statusClass(item.status);
              applyGlobalFilter();
            });
            footer.appendChild(select);

            if (row.fields[field].items.length > 1) {
              const removeBtn = document.createElement('button');
              removeBtn.className = 'remove-item-btn';
              removeBtn.title = 'Quitar sub-card';
              removeBtn.innerHTML = '<span class="material-icons-round">close</span>';
              removeBtn.onclick = () => {
                row.fields[field].items.splice(itemIdx, 1);
                render();
              };
              footer.appendChild(removeBtn);
            }

            itemCard.appendChild(footer);
            block.appendChild(itemCard);
          });

          grid.appendChild(block);
        });

        card.appendChild(grid);
        mainContainer.appendChild(card);
      });

      applyGlobalFilter();
    }

    render();
    setSaveStatus('ok', 'Cargado (offline)');

  </script>
</body>

</html>
