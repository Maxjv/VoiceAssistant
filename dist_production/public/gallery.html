<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontImgs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --header-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-primary); min-height: 100vh; }
        header {
            position: sticky; top: 0; z-index: 5;
            background: var(--header-bg);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 10px 16px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .crumb {
            background: none; border: none; color: var(--text-secondary);
            font-size: 0.85rem; cursor: pointer; padding: 4px 6px; border-radius: 6px;
        }
        .crumb:hover { background: rgba(255,255,255,0.08); color: white; }
        .crumb.current { color: var(--accent-color); font-weight: 600; cursor: default; }
        .crumb.current:hover { background: none; }
        .sep { color: var(--text-secondary); opacity: 0.5; }
        main { padding: 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .tile {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s;
            display: flex; flex-direction: column;
        }
        .tile:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .tile-folder {
            align-items: center; justify-content: center;
            padding: 20px 8px; gap: 6px; text-align: center;
        }
        .tile-folder .material-icons-round { font-size: 2rem; color: var(--accent-color); }
        .tile-folder span.name { font-size: 0.78rem; color: var(--text-primary); word-break: break-word; }
        .tile-img img {
            width: 100%; height: 110px; object-fit: cover; display: block;
            background: #fff;
        }
        .tile-img span.name {
            font-size: 0.7rem; color: var(--text-secondary);
            padding: 6px 8px; word-break: break-word;
        }
        .empty { color: var(--text-secondary); font-size: 0.9rem; padding: 30px; text-align: center; }

        .lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .lightbox.hidden { display: none; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
    </style>
</head>
<body>
    <header id="crumbs"></header>
    <main>
        <div class="grid" id="grid"></div>
        <p class="empty" id="emptyMsg" style="display:none;">Carpeta vacía.</p>
    </main>
    <div class="lightbox hidden" id="lightbox">
        <img id="lightboxImg" src="" alt="">
    </div>

    <script>
        const grid = document.getElementById('grid');
        const crumbsEl = document.getElementById('crumbs');
        const emptyMsg = document.getElementById('emptyMsg');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        function load(dir) {
            fetch('/api/browse?dir=' + encodeURIComponent(dir))
                .then(r => r.json())
                .then(data => render(data.dir, data.folders || [], data.images || []))
                .catch(() => { grid.innerHTML = ''; emptyMsg.style.display = 'block'; emptyMsg.textContent = 'Error cargando la carpeta.'; });
        }

        function render(dir, folders, images) {
            history.replaceState(null, '', '?dir=' + encodeURIComponent(dir));

            const parts = dir ? dir.split('/').filter(Boolean) : [];
            let acc = '';
            crumbsEl.innerHTML = '';
            const rootBtn = document.createElement('button');
            rootBtn.className = 'crumb' + (parts.length === 0 ? ' current' : '');
            rootBtn.textContent = 'Proyecto';
            rootBtn.onclick = () => load('');
            crumbsEl.appendChild(rootBtn);
            parts.forEach((p, i) => {
                acc += (acc ? '/' : '') + p;
                const sep = document.createElement('span');
                sep.className = 'sep';
                sep.textContent = ' / ';
                crumbsEl.appendChild(sep);
                const b = document.createElement('button');
                const isLast = i === parts.length - 1;
                b.className = 'crumb' + (isLast ? ' current' : '');
                b.textContent = p;
                const target = acc;
                b.onclick = () => load(target);
                crumbsEl.appendChild(b);
            });

            grid.innerHTML = '';
            folders.forEach(name => {
                const tile = document.createElement('div');
                tile.className = 'tile tile-folder';
                tile.innerHTML = '<span class="material-icons-round">folder</span><span class="name"></span>';
                tile.querySelector('.name').textContent = name;
                tile.onclick = () => load(dir ? dir + '/' + name : name);
                grid.appendChild(tile);
            });
            images.forEach(name => {
                const tile = document.createElement('div');
                tile.className = 'tile tile-img';
                const src = '/preview/' + (dir ? dir + '/' : '') + name;
                tile.innerHTML = '<img loading="lazy" src="' + src + '"><span class="name"></span>';
                tile.querySelector('.name').textContent = name;
                tile.onclick = () => { lightboxImg.src = src; lightbox.classList.remove('hidden'); };
                grid.appendChild(tile);
            });
            emptyMsg.style.display = (folders.length === 0 && images.length === 0) ? 'block' : 'none';
            emptyMsg.textContent = 'Carpeta vacía.';
        }

        lightbox.addEventListener('click', () => lightbox.classList.add('hidden'));

        const initialDir = new URLSearchParams(location.search).get('dir') || '';
        load(initialDir);
    </script>
</body>
</html>
