<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructor Visual de Control</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar / Palette */
        .palette {
            width: 170px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .palette h2 {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: 1fr;
            grid-auto-rows: 1fr;
            gap: 10px;
            flex: 1;
        }

        .palette-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
            user-select: none;
            font-size: 0.9rem;
            text-align: center;
        }

        .palette-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            position: relative;
        }

        .toolbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 20px;
            gap: 10px;
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn.primary {
            background: var(--accent);
            color: #020617;
            border-color: var(--accent);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .canvas {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .dropzone {
            min-height: 100px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .dropzone.drag-over {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .empty-canvas-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 1.1rem;
            pointer-events: none;
        }

        /* Blocks */
        .block {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            width: 50%; /* A la mitad */
            min-width: 350px;
        }

        .block-header {
            padding: 10px 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .block-title {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .block-actions {
            display: flex;
            gap: 5px;
        }

        .block-actions span {
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        
        .block-actions span:hover {
            color: var(--text-main);
        }
        .block-actions span.delete:hover {
            color: var(--danger);
        }

        .block-content {
            padding: 15px;
        }

        .block-content .dropzone {
            min-height: 60px;
            padding: 10px;
            margin-top: 10px;
        }

        .prop-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea.prop-input {
            resize: none;
            overflow: hidden;
            min-height: 40px;
            padding-left: 45px;
        }
        
        .inst-wrapper {
            position: relative;
            width: 100%;
            margin-top: 8px;
        }
        
        .mic-btn {
            position: absolute;
            left: 8px;
            bottom: 8px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mic-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            transform: scale(1.1);
        }
        
        .mic-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Nested indents */
        .block-type-screen { border-left: 4px solid #8b5cf6; }
        .block-type-card { border-left: 4px solid #3b82f6; }
        .block-type-modal { border-left: 4px solid #f59e0b; }
        .block-type-button { border-left: 4px solid #10b981; }
        .block-type-list { border-left: 4px solid #ec4899; }
        .block-type-filter { border-left: 4px solid #06b6d4; }

    </style>
</head>
<body>

    <div class="palette">
        <h2><span class="material-icons-round">category</span> Componentes</h2>
        <div class="palette-grid">
            <div class="palette-item" draggable="true" data-type="screen">
                <span class="material-icons-round" style="color: #8b5cf6;">desktop_windows</span> Screen
            </div>
            <div class="palette-item" draggable="true" data-type="card">
                <span class="material-icons-round" style="color: #3b82f6;">crop_din</span> Card
            </div>
            <div class="palette-item" draggable="true" data-type="modal">
                <span class="material-icons-round" style="color: #f59e0b;">picture_in_picture</span> Modal
            </div>
            <div class="palette-item" draggable="true" data-type="list">
                <span class="material-icons-round" style="color: #ec4899;">format_list_bulleted</span> Lista
            </div>
            <div class="palette-item" draggable="true" data-type="filter">
                <span class="material-icons-round" style="color: #06b6d4;">filter_alt</span> Filtro
            </div>
            <div class="palette-item" draggable="true" data-type="button">
                <span class="material-icons-round" style="color: #10b981;">smart_button</span> Botón
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <div class="header-actions">
            <button class="btn btn-primary hidden" id="btnSave" style="display: none;"><span class="material-icons-round">save</span> Guardar Tablero</button>
        </div>
        <div class="canvas">
            <div class="dropzone" id="mainCanvas">
                <div class="empty-canvas-msg">Arrastra componentes aquí para comenzar a construir tu tablero.</div>
            </div>
        </div>
    </div>

    <script>
        // ESTADO DE DATOS (Se guardará en el propio HTML al inyectar)
        let controlData = []; 
        /* __DATA_INJECTION_POINT__ */

        const mainCanvas = document.getElementById('mainCanvas');
        let draggedType = null;
        let draggedElement = null;

        const icons = {
            'screen': 'desktop_windows',
            'card': 'crop_din',
            'modal': 'picture_in_picture',
            'list': 'format_list_bulleted',
            'filter': 'filter_alt',
            'button': 'smart_button'
        };

        function initDragAndDrop() {
            const items = document.querySelectorAll('.palette-item');
            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedType = e.target.getAttribute('data-type');
                    e.dataTransfer.setData('text/plain', draggedType);
                });
            });

            setupDropzone(mainCanvas);
        }

        function setupDropzone(dz) {
            dz.addEventListener('dragover', e => {
                e.preventDefault();
                e.stopPropagation();
                dz.classList.add('drag-over');
            });

            dz.addEventListener('dragleave', e => {
                e.preventDefault();
                e.stopPropagation();
                dz.classList.remove('drag-over');
            });

            dz.addEventListener('drop', e => {
                e.preventDefault();
                e.stopPropagation();
                dz.classList.remove('drag-over');
                
                const type = e.dataTransfer.getData('text/plain');
                if (!type) return;

                if (draggedElement) {
                    // Moving an existing block
                    if (draggedElement !== dz && !draggedElement.contains(dz)) {
                        dz.appendChild(draggedElement);
                        if(dz === mainCanvas) updateEmptyMsg();
                    }
                    draggedElement = null;
                } else {
                    // Creating new block from palette
                    const block = createBlock(type);
                    dz.appendChild(block);
                    if(dz === mainCanvas) updateEmptyMsg();
                }
            });
        }

        function createBlock(type, config = { title: '', instruction: '' }) {
            const el = document.createElement('div');
            el.className = `block block-type-${type}`;
            el.draggable = true;
            
            const titleText = type.charAt(0).toUpperCase() + type.slice(1);
            
            const showInstruction = type !== 'screen';
            const instructionHtml = showInstruction 
                ? `<div class="inst-wrapper">
                    <textarea class="prop-input inst-input" placeholder="Instrucción de la tarea..." rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'; autoSaveControl()" onblur="autoSaveControl()">${config.instruction || ''}</textarea>
                    <button class="mic-btn" title="Dictar instrucción"><span class="material-icons-round" style="font-size: 1.1rem;">mic</span></button>
                   </div>` 
                : '';
            
            el.innerHTML = `
                <div class="block-header">
                    <div class="block-title">
                        <span class="material-icons-round">${icons[type]}</span> ${titleText}
                    </div>
                    <div class="block-actions">
                        <span class="material-icons-round delete" title="Eliminar">delete</span>
                    </div>
                </div>
                <div class="block-content">
                    <input type="text" class="prop-input name-input" placeholder="Nombre/Etiqueta del ${titleText}" value="${config.title}" oninput="autoSaveControl()" onblur="autoSaveControl()">
                    ${instructionHtml}
                    ${type !== 'button' && type !== 'filter' ? '<div class="dropzone child-dropzone"></div>' : ''}
                </div>
            `;

            el.addEventListener('dragstart', (e) => {
                e.stopPropagation();
                draggedElement = el;
                e.dataTransfer.setData('text/plain', type);
            });

            // Arreglo para poder seleccionar texto en inputs
            const inputs = el.querySelectorAll('input, textarea');
            inputs.forEach(inp => {
                inp.addEventListener('mousedown', () => el.draggable = false);
                inp.addEventListener('mouseup', () => el.draggable = true);
                inp.addEventListener('mouseleave', () => el.draggable = true);
            });

            const delBtn = el.querySelector('.delete');
            delBtn.addEventListener('click', () => {
                el.remove();
                updateEmptyMsg();
            });

            const childDz = el.querySelector('.child-dropzone');
            if (childDz) {
                setupDropzone(childDz);
            }

            return el;
        }

        function updateEmptyMsg() {
            const hasBlocks = mainCanvas.querySelectorAll('.block').length > 0;
            const msg = mainCanvas.querySelector('.empty-canvas-msg');
            if (hasBlocks && msg) {
                msg.style.display = 'none';
            } else if (!hasBlocks && msg) {
                msg.style.display = 'block';
            } else if (!hasBlocks && !msg) {
                mainCanvas.innerHTML = '<div class="empty-canvas-msg">Arrastra componentes aquí para comenzar a construir tu tablero.</div>';
            }
            autoSaveControl();
        }

        function serializeTree(container) {
            const data = [];
            const blocks = Array.from(container.children).filter(c => c.classList.contains('block'));
            
            blocks.forEach(b => {
                const type = b.className.match(/block-type-(\w+)/)[1];
                const contentDiv = b.querySelector(':scope > .block-content');
                const nameInput = contentDiv ? contentDiv.querySelector(':scope > .name-input') : null;
                const title = nameInput ? nameInput.value : `Nuevo ${type}`;
                const instInput = contentDiv ? contentDiv.querySelector(':scope > .inst-wrapper .inst-input') : null;
                const instruction = instInput ? instInput.value : '';
                const childDz = contentDiv ? contentDiv.querySelector(':scope > .child-dropzone') : null;
                
                const node = { type, title, instruction };
                if (childDz) {
                    node.children = serializeTree(childDz);
                }
                data.push(node);
            });
            
            return data;
        }

        function renderTree(data, container) {
            data.forEach(node => {
                const block = createBlock(node.type, { title: node.title, instruction: node.instruction });
                container.appendChild(block);
                
                if (node.children && node.children.length > 0) {
                    const childDz = block.querySelector('.child-dropzone');
                    if (childDz) renderTree(node.children, childDz);
                }
            });
        }

        let saveTimeout;
        async function autoSaveControl() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const newData = serializeTree(mainCanvas);
                try {
                    await fetch('/api/control/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: newData })
                    });
                    // Avisar al padre (app.js) que se guardó para que recargue la cola de tareas
                    window.parent.postMessage({ type: 'CONTROL_SAVED' }, '*');
                } catch (e) {
                    console.error("Autosave error", e);
                }
            }, 500);
        }

        // Init
        initDragAndDrop();
        
        // --- MIC DICTATION ---
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-ES'; // o el idioma que prefieras
        }

        function toggleDictation(btn) {
            if (!recognition) {
                alert("Tu navegador no soporta dictado por voz. Usa Chrome.");
                return;
            }
            
            const wrapper = btn.closest('.inst-wrapper');
            const textarea = wrapper.querySelector('textarea');
            
            if (btn.classList.contains('recording')) {
                recognition.stop();
                btn.classList.remove('recording');
                btn.innerHTML = '<span class="material-icons-round" style="font-size: 1.1rem;">mic</span>';
                return;
            }
            
            // Si ya hay alguien grabando, pararlo
            const activeMic = document.querySelector('.mic-btn.recording');
            if (activeMic) {
                activeMic.click();
            }
            
            btn.classList.add('recording');
            btn.innerHTML = '<span class="material-icons-round" style="font-size: 1.1rem;">stop</span>';
            
            let finalTranscript = textarea.value ? textarea.value + " " : "";
            
            recognition.onresult = function(event) {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                textarea.value = finalTranscript + interimTranscript;
                textarea.style.height = '';
                textarea.style.height = textarea.scrollHeight + 'px';
                textarea.dispatchEvent(new Event('input', { bubbles: true }));
            };
            
            recognition.onerror = function(event) {
                console.error("Mic error:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Permiso de micrófono denegado. Habilita el micrófono en Chrome (candadito en la barra de URL).");
                } else if (event.error !== 'aborted') {
                    alert("Error en el micrófono: " + event.error);
                }
                btn.classList.remove('recording');
                btn.innerHTML = '<span class="material-icons-round" style="font-size: 1.1rem;">mic</span>';
            };
            
            recognition.onend = function() {
                btn.classList.remove('recording');
                btn.innerHTML = '<span class="material-icons-round" style="font-size: 1.1rem;">mic</span>';
            };
            
            recognition.start();
        }

        // Event delegation for dynamically created mic buttons
        document.addEventListener('click', function(e) {
            const micBtn = e.target.closest('.mic-btn');
            if (micBtn) {
                toggleDictation(micBtn);
            }
        });

        // Auto-save on dictate end so Voice dictation saves too!
        const originalToggleDictation = toggleDictation;
        toggleDictation = function(btn) {
            // override to call autoSaveControl on end
            // Handled dynamically inside toggleDictation onresult
            originalToggleDictation(btn);
        }

        if (controlData && controlData.length > 0) {
            const msg = mainCanvas.querySelector('.empty-canvas-msg');
            if (msg) msg.style.display = 'none';
            renderTree(controlData, mainCanvas);
        }

    </script>
</body>
</html>
