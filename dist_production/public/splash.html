<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciando AnywhereDesign...</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            background-color: #060B15;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        img {
            max-width: 280px;
            margin-bottom: 30px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(56, 189, 248, 0.15);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .status {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: 600;
            text-transform: uppercase;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <img src="logo.png" alt="AnywhereDesign Logo">
    <div class="spinner"></div>
    <div class="status">Preparando entorno local...</div>

    <script>
        const checkServer = () => {
            if (window.self !== window.top) {
                // Estamos dentro del iframe de AnywhereDesign: esperar a que la app responda y cargar /react
                fetch('/api/check-target')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.ready) {
                            window.location.replace('/react?t=' + Date.now());
                        }
                    })
                    .catch(() => { });
            } else {
                // Pestaña principal: redirigir al túnel Cloudflare
                fetch('/api/ready-url')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.ready && data.url) {
                            window.location.replace(data.url);
                        }
                    })
                    .catch(() => { });
            }
        };
        setInterval(checkServer, 1000);
    </script>
</body>

</html>
